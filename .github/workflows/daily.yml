name: 每日复盘
on:
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  daily-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 📊 生成每日复盘
        env:
          DINGDING_WEBHOOK_URL: ${{ secrets.DINGDING_WEBHOOK_URL }}
          DINGDING_SECRET: ${{ secrets.DINGDING_SECRET }}
          TZ: Asia/Shanghai
        run: |
          python3 scripts/daily_review.py
